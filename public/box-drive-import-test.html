<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Box Driveフォルダ取込・表示検証</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      color: #202124;
      background: #f5f6f7;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      width: min(880px, calc(100% - 32px));
      margin: 32px auto;
      padding: 28px;
      border: 1px solid #d5d9de;
      border-radius: 6px;
      background: #ffffff;
    }

    h1 { margin: 0 0 8px; font-size: 24px; }
    .lead { margin: 0 0 24px; color: #4b5563; }
    h2 { margin: 28px 0 12px; font-size: 18px; }

    .environment {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: 0;
      border-top: 1px solid #d5d9de;
      border-left: 1px solid #d5d9de;
    }

    .environment div {
      padding: 10px 12px;
      overflow-wrap: anywhere;
      border-right: 1px solid #d5d9de;
      border-bottom: 1px solid #d5d9de;
    }

    dt { display: inline; font-weight: 700; }
    dd { display: inline; margin: 0; }
    .available { color: #137333; font-weight: 700; }
    .unavailable { color: #b3261e; font-weight: 700; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    button,
    .file-label {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid #1557b0;
      border-radius: 4px;
      font: inherit;
      cursor: pointer;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      background: #1557b0;
      color: #ffffff;
    }

    .file-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    button { background: #ffffff; color: #1557b0; }

    button:disabled,
    .file-label.busy {
      border-color: #9aa0a6;
      background: #e8eaed;
      color: #5f6368;
      cursor: wait;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .summary div { padding: 12px; border: 1px solid #d5d9de; border-radius: 4px; }
    .summary strong { display: block; margin-bottom: 4px; font-size: 13px; color: #4b5563; }

    .result {
      min-height: 210px;
      margin: 0;
      padding: 16px;
      overflow: auto;
      border: 1px solid #9aa0a6;
      border-radius: 4px;
      background: #f8f9fa;
      font-family: "BIZ UDゴシック", "MS Gothic", monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 640px) {
      main { margin: 16px auto; padding: 18px; }
      .environment, .summary { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      button, .file-label { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Box Driveフォルダ取込・表示検証</h1>
    <p class="lead">選択したフォルダをブラウザ内へ保存し、Service Worker経由でtarget.htmlを表示します。</p>

    <h2>環境情報</h2>
    <dl class="environment">
      <div><dt>Secure Context: </dt><dd id="secure-context"></dd></div>
      <div><dt>webkitdirectory: </dt><dd id="webkit-directory"></dd></div>
      <div><dt>Cache Storage: </dt><dd id="cache-storage"></dd></div>
      <div><dt>Service Worker: </dt><dd id="service-worker"></dd></div>
    </dl>

    <h2>検証操作</h2>
    <div class="actions">
      <label id="file-label" class="file-label">
        Box Driveフォルダを選択
        <input id="directory-input" type="file" webkitdirectory multiple>
      </label>
      <button id="open-target" type="button" disabled>保存済みtarget.htmlを開く</button>
      <button id="check-saved" type="button">保存状況を確認</button>
      <button id="delete-saved" type="button">保存データを削除</button>
    </div>

    <div class="summary" aria-label="取込概要">
      <div><strong>選択フォルダ</strong><span id="folder-name">未選択</span></div>
      <div><strong>ファイル数</strong><span id="file-count">0</span></div>
      <div><strong>合計サイズ</strong><span id="total-size">0 bytes</span></div>
    </div>

    <h2>検証結果</h2>
    <pre id="result" class="result" aria-live="polite">未実行です。「Box Driveフォルダを選択」を押してください。</pre>
  </main>

  <script>
    'use strict';

    const CACHE_NAME = 'box-drive-import-content-v1';
    const MANIFEST_PATH = '__manifest__.json';
    const TARGET_FILE_NAME = 'target.html';
    const CONTENT_SCOPE_PATH = 'box-drive-import-test-content/';
    const WORKER_PATH = 'box-drive-import-test-sw.js';

    const directoryInput = document.querySelector('#directory-input');
    const fileLabel = document.querySelector('#file-label');
    const openTargetButton = document.querySelector('#open-target');
    const actionButtons = [...document.querySelectorAll('button')];
    const resultElement = document.querySelector('#result');
    let savedManifest = null;
    let workerRegistration = null;

    function setAvailability(elementId, value, isAvailable) {
      const element = document.querySelector(`#${elementId}`);
      element.textContent = String(value);
      element.className = isAvailable ? 'available' : 'unavailable';
    }

    function showResult(message) {
      resultElement.textContent = message;
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 bytes';
      const units = ['bytes', 'KB', 'MB', 'GB'];
      const unitIndex = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      const value = bytes / (1024 ** unitIndex);
      return `${value.toLocaleString(undefined, { maximumFractionDigits: 1 })} ${units[unitIndex]}`;
    }

    function formatError(action, error) {
      const errorName = error && error.name ? error.name : 'UnknownError';
      const errorMessage = error && error.message ? error.message : String(error);
      return `[エラー] ${action}\nエラー名: ${errorName}\nメッセージ: ${errorMessage}`;
    }

    function reportError(action, error) {
      console.error(action, error);
      showResult(formatError(action, error));
    }

    function setBusy(isBusy) {
      directoryInput.disabled = isBusy;
      fileLabel.classList.toggle('busy', isBusy);
      actionButtons.forEach((button) => { button.disabled = isBusy; });
      if (!isBusy) openTargetButton.disabled = !savedManifest;
    }

    function updateSummary(manifest) {
      document.querySelector('#folder-name').textContent = manifest ? manifest.folderName : '未選択';
      document.querySelector('#file-count').textContent = manifest ? manifest.fileCount.toLocaleString() : '0';
      document.querySelector('#total-size').textContent = manifest ? formatBytes(manifest.totalSize) : '0 bytes';
      openTargetButton.disabled = !manifest;
    }

    function encodedPath(path) {
      return path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    }

    function contentUrl(relativePath) {
      return new URL(`${CONTENT_SCOPE_PATH}${encodedPath(relativePath)}`, document.baseURI).href;
    }

    function manifestUrl() {
      return contentUrl(MANIFEST_PATH);
    }

    function relativePath(file) {
      const parts = file.webkitRelativePath.split('/').filter(Boolean);
      return parts.slice(1).join('/');
    }

    function mimeTypeFor(file, path) {
      if (file.type) return file.type;
      const extension = path.split('.').pop().toLowerCase();
      const mimeTypes = {
        html: 'text/html; charset=utf-8', htm: 'text/html; charset=utf-8',
        css: 'text/css; charset=utf-8', js: 'text/javascript; charset=utf-8',
        mjs: 'text/javascript; charset=utf-8', json: 'application/json; charset=utf-8',
        txt: 'text/plain; charset=utf-8', xml: 'application/xml; charset=utf-8',
        svg: 'image/svg+xml', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
        gif: 'image/gif', webp: 'image/webp', ico: 'image/x-icon', pdf: 'application/pdf',
        woff: 'font/woff', woff2: 'font/woff2', ttf: 'font/ttf'
      };
      return mimeTypes[extension] || 'application/octet-stream';
    }

    async function waitForActiveWorker(registration) {
      if (registration.active) return registration;
      const worker = registration.installing || registration.waiting;
      if (!worker) throw new Error('Service Workerのインストール状態を取得できません。');
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('Service Workerの有効化がタイムアウトしました。')), 10000);
        worker.addEventListener('statechange', () => {
          if (worker.state === 'activated') {
            clearTimeout(timeout);
            resolve();
          } else if (worker.state === 'redundant') {
            clearTimeout(timeout);
            reject(new Error('Service Workerのインストールに失敗しました。'));
          }
        });
      });
      return registration;
    }

    async function registerWorker() {
      if (!('serviceWorker' in navigator)) {
        throw new Error('Service Workerがこのブラウザで利用できません。');
      }
      const scopeUrl = new URL(CONTENT_SCOPE_PATH, document.baseURI);
      workerRegistration = await navigator.serviceWorker.register(
        new URL(WORKER_PATH, document.baseURI),
        { scope: scopeUrl.pathname }
      );
      await waitForActiveWorker(workerRegistration);
      setAvailability('service-worker', 'registered', true);
    }

    async function loadManifest() {
      if (!('caches' in window)) return null;
      const cache = await caches.open(CACHE_NAME);
      const response = await cache.match(manifestUrl());
      if (!response) return null;
      return response.json();
    }

    async function saveFiles(files) {
      const entries = files.map((file) => ({ file, path: relativePath(file) }));
      const invalidEntry = entries.find((entry) => !entry.path || entry.path.includes('../'));
      if (invalidEntry) throw new DOMException('安全でない相対パスが含まれています。', 'SecurityError');

      const targetEntry = entries.find((entry) => entry.path.toLowerCase() === TARGET_FILE_NAME);
      if (!targetEntry) {
        throw new DOMException(`選択フォルダ直下に${TARGET_FILE_NAME}がありません。`, 'NotFoundError');
      }

      const totalSize = files.reduce((sum, file) => sum + file.size, 0);
      if (navigator.storage && navigator.storage.estimate) {
        const estimate = await navigator.storage.estimate();
        const available = estimate.quota - estimate.usage;
        if (Number.isFinite(available) && totalSize > available) {
          throw new DOMException(
            `必要容量${formatBytes(totalSize)}に対し、推定空き容量は${formatBytes(Math.max(available, 0))}です。`,
            'QuotaExceededError'
          );
        }
      }

      const rootFolder = files[0].webkitRelativePath.split('/')[0] || '(不明)';
      const importedAt = new Date().toISOString();
      const manifest = {
        folderName: rootFolder,
        fileCount: files.length,
        totalSize,
        importedAt,
        targetPath: TARGET_FILE_NAME
      };

      await caches.delete(CACHE_NAME);
      const cache = await caches.open(CACHE_NAME);
      for (let index = 0; index < entries.length; index += 1) {
        const entry = entries[index];
        const headers = new Headers({
          'Content-Type': mimeTypeFor(entry.file, entry.path),
          'X-Box-Drive-Relative-Path': encodeURIComponent(entry.path),
          'X-Box-Drive-Imported-At': importedAt
        });
        await cache.put(contentUrl(entry.path), new Response(entry.file, { headers }));
        if (index === 0 || (index + 1) % 25 === 0 || index === entries.length - 1) {
          showResult(
            `[処理中] ${files.length.toLocaleString()}ファイルをブラウザ内へ保存しています...\n` +
            `進捗: ${(index + 1).toLocaleString()} / ${files.length.toLocaleString()}`
          );
        }
      }
      await cache.put(
        manifestUrl(),
        new Response(JSON.stringify(manifest), { headers: { 'Content-Type': 'application/json; charset=utf-8' } })
      );
      return manifest;
    }

    directoryInput.addEventListener('change', async () => {
      const files = [...directoryInput.files];
      if (files.length === 0) {
        showResult('[キャンセル] フォルダは選択されませんでした。既存の保存データは変更していません。');
        return;
      }

      setBusy(true);
      const pendingManifest = {
        folderName: files[0].webkitRelativePath.split('/')[0] || '(不明)',
        fileCount: files.length,
        totalSize: files.reduce((sum, file) => sum + file.size, 0)
      };
      updateSummary(pendingManifest);
      try {
        const manifest = await saveFiles(files);
        savedManifest = manifest;
        updateSummary(manifest);
        showResult(
          '[成功] フォルダをブラウザ内へ保存しました。\n' +
          `ルートフォルダ: ${manifest.folderName}\n` +
          `ファイル数: ${manifest.fileCount.toLocaleString()}\n` +
          `合計サイズ: ${formatBytes(manifest.totalSize)}\n` +
          `target.html: あり\n` +
          `Service Worker表示URL: ${contentUrl(manifest.targetPath)}`
        );
      } catch (error) {
        savedManifest = await loadManifest().catch(() => null);
        updateSummary(savedManifest);
        reportError('フォルダの取込に失敗しました。', error);
      } finally {
        directoryInput.value = '';
        setBusy(false);
      }
    });

    openTargetButton.addEventListener('click', () => {
      if (!savedManifest) {
        showResult('[エラー] 保存済みtarget.htmlがありません。');
        return;
      }
      window.open(contentUrl(savedManifest.targetPath), '_blank', 'noopener');
    });

    document.querySelector('#check-saved').addEventListener('click', async () => {
      setBusy(true);
      try {
        savedManifest = await loadManifest();
        updateSummary(savedManifest);
        if (!savedManifest) {
          showResult('[未保存] ブラウザ内に保存済みフォルダはありません。');
          return;
        }
        showResult(
          '[成功] 保存済みフォルダを確認しました。\n' +
          `ルートフォルダ: ${savedManifest.folderName}\n` +
          `ファイル数: ${savedManifest.fileCount.toLocaleString()}\n` +
          `合計サイズ: ${formatBytes(savedManifest.totalSize)}\n` +
          `保存日時: ${savedManifest.importedAt}\n` +
          `target.html表示URL: ${contentUrl(savedManifest.targetPath)}`
        );
      } catch (error) {
        reportError('保存状況の確認に失敗しました。', error);
      } finally {
        setBusy(false);
      }
    });

    document.querySelector('#delete-saved').addEventListener('click', async () => {
      setBusy(true);
      try {
        const deleted = await caches.delete(CACHE_NAME);
        savedManifest = null;
        updateSummary(null);
        showResult(deleted ? '[成功] 保存データを削除しました。' : '[未保存] 削除対象の保存データはありません。');
      } catch (error) {
        reportError('保存データの削除に失敗しました。', error);
      } finally {
        setBusy(false);
      }
    });

    async function initialize() {
      setAvailability('secure-context', window.isSecureContext, window.isSecureContext);
      setAvailability('webkit-directory', 'webkitdirectory' in directoryInput, 'webkitdirectory' in directoryInput);
      setAvailability('cache-storage', 'caches' in window, 'caches' in window);
      setAvailability('service-worker', 'registering...', true);

      try {
        await registerWorker();
        savedManifest = await loadManifest();
        updateSummary(savedManifest);
        if (savedManifest) {
          showResult(
            '[成功] 再読み込み後も保存データを確認できました。\n' +
            `ルートフォルダ: ${savedManifest.folderName}\n` +
            `target.html表示URL: ${contentUrl(savedManifest.targetPath)}`
          );
        }
      } catch (error) {
        setAvailability('service-worker', 'error', false);
        reportError('初期化に失敗しました。', error);
      }
    }

    initialize();
  </script>
</body>
</html>
